<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e0d" />
    <title>FitFlow</title>
    <meta name="description" content="Mood-based workout plans from curated YouTube videos." />
    <script>
      // Paint the right theme from the first frame (spec 002, FR-5): the saved
      // choice, else the device setting. Same key as THEME_KEY in storage.js.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('fitflow:theme')
        } catch (error) {
          // Storage blocked: fall back to the device setting.
        }
        if (theme !== 'dark' && theme !== 'light') {
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          theme = prefersLight ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#f6f5fb' : '#0c0e0d')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
